<script>
        // Simple script to handle visual state of radio card selection
        function updateSelection(selectedRadio) {
            // Remove 'selected' class and reset styles from all cards
            document.querySelectorAll('.interp-card').forEach(card => {
                card.classList.remove('selected');
                card.classList.remove('border-primary');
                card.classList.remove('bg-surface-container-lowest');
                card.classList.add('border-outline-variant');
                card.classList.add('bg-surface-container-low');
                card.style.boxShadow = 'none';
            });

            // Add 'selected' class and styles to the closest label of the checked radio
            const activeCard = selectedRadio.closest('label');
            if (activeCard) {
                activeCard.classList.add('selected');
                activeCard.classList.remove('border-outline-variant');
                activeCard.classList.remove('bg-surface-container-low');
                activeCard.classList.add('border-primary');
                activeCard.classList.add('bg-surface-container-lowest');
                // The box shadow is applied via CSS class .selected, but explicitly adding here if needed for inline
            }
        }
    </script>
