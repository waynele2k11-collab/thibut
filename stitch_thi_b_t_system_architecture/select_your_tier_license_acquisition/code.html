<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background dark:bg-background transition-all duration-300 ease-in-out">
<div class="flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4 w-full max-w-container-max mx-auto">

</section>
<!-- License Tiers List -->
<div class="flex flex-col gap-6 no-scrollbar">
<!-- Tier 1: Personal Use -->
<label class="block relative cursor-pointer group">
<input class="peer sr-only" name="license_tier" type="radio" value="personal"/>
<div class="border border-outline-variant rounded-DEFAULT p-6 bg-surface-container-lowest transition-all duration-300 peer-checked:border-primary peer-checked:ring-1 peer-checked:ring-primary">
<div class="flex justify-between items-start mb-4">
<div>
<h3 class="font-headline-sm text-headline-sm text-primary">Personal Canvas</h3>
<div class="font-body-md text-body-md text-on-surface-variant mt-1">Non-commercial display</div>
</div>
<div class="text-right">
<span class="font-body-lg text-body-lg text-primary block">$150</span>
</div>
</div>
<div class="h-px bg-outline-variant/30 w-12 mb-4"></div>
<ul class="space-y-3 font-body-md text-body-md text-on-surface">
<li class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline-variant text-[20px]">check_circle</span>
<span>Private Residential Display</span>
</li>
<li class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline-variant text-[20px]">check_circle</span>
<span>Digital Archival Copy (1x)</span>
</li>

</li>
</ul>
</div>
</label>

<span class="material-symbols-outlined absolute top-3 right-3 text-primary text-[18px] pointer-events-none hidden peer-checked:block z-10" style="font-variation-settings: 'FILL' 1;">check</span>
<div class="flex justify-between items-start mb-4">
<div>
<div class="inline-block bg-surface-container-low px-2 py-1 rounded-sm mb-2">

<div class="font-body-md text-body-md text-on-surface-variant mt-1">Public &amp; corporate spaces</div>
</div>
<div class="text-right">
<span class="font-body-lg text-body-lg text-primary block">$850</span>
</div>
</div>
<div class="h-px bg-outline-variant/30 w-12 mb-4"></div>
<ul class="space-y-3 font-body-md text-body-md text-on-surface">

<div>

</div>
<div class="text-right">
<span class="font-body-lg text-body-lg text-primary block">Contact Us</span>

<div class="h-px bg-outline-variant/30 w-12 mb-4"></div>
