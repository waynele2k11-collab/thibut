<!DOCTYPE html>

                        "on-surface": "#1b1c19",
                        "surface-container": "#f0eee9",
                        "outline": "#76777b",
                        "outline-variant": "#c7c6ca",
                        "surface-variant": "#e4e2dd",
                        "primary": "#000000",

                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {

                        "unit": "8px",
                        "container-max": "1280px",
                        "gutter": "24px",
                        "margin-mobile": "24px",
                        "margin-desktop": "64px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-sm": ["Playfair Display"],

<style>
        body {
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.03"/%3E%3C/svg%3E');
        }
    </style>

<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col md:hidden">
<!-- TopAppBar (Transactional context, no bottom nav) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 bg-surface border-b border-outline-variant flat no shadows">
<button aria-label="Go back" class="text-primary hover:opacity-80 transition-opacity flex items-center justify-center p-2 -ml-2">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary uppercase tracking-widest text-center flex-1 mx-4">Design &amp; Preview</h1>
<button aria-label="Close" class="text-primary hover:opacity-80 transition-opacity flex items-center justify-center p-2 -mr-2">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</header>
<main class="flex-1 mt-16 pt-8 pb-32 px-margin-mobile flex flex-col space-y-12">
<!-- Product Mockup Area -->
<section class="flex flex-col items-center w-full">
<div class="relative w-full aspect-[3/4] bg-surface-container-highest overflow-hidden mb-6 flex items-center justify-center">
<!-- Main Product Image placeholder -->
<img alt="Premium Washi Hoodie with Calligraphy" class="absolute inset-0 w-full h-full object-cover z-10" data-alt="A pristine white premium heavy cotton hoodie displayed on a minimalist mannequin against a soft, well-lit white studio background. On the chest of the hoodie, there is an elegant, bold black calligraphy design in a semi-cursive Japanese style reading 'Shichitenhakki'. The lighting emphasizes the high-quality texture of the fabric and the crisp contrast of the black ink. The overall aesthetic is minimalist, modern, and highly tactile." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDZ8vdmySkTr2wXWN8R4renz2uIf4hB_ZO8lIMV8SaI0O42U6s6oK_LYLQ55hbt0XYq39Y3UvpvcFUjmxuR3_WqatN7m19bXVRWINgWox_EQfErwwjJxa4EpBKHMqUBfc2EQKmWXvl0U_Xs1Wahp4W4rE1fzg9sbJqvV0-S3sxuMaS51kYfwd3YNCc7jUR6KBYQJM0kks11p-k-U13oLI0Wk3FiinIm3l3fiAJFGUVypRKfs9X1fSWv"/>
<!-- Artisan Badge -->
<div class="absolute bottom-4 right-4 z-20 bg-surface/90 backdrop-blur-sm px-4 py-2 border border-outline-variant flex items-center space-x-2">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">brush</span>
<span class="font-label-caps text-label-caps text-on-surface">Master Wei</span>
</div>
</div>
<div class="text-center space-y-2">
<h2 class="font-headline-sm text-headline-sm">Premium Washi Hoodie</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Shichitenhakki • Gyosho Style</p>
</div>
</section>
<!-- Customization Controls -->
<section class="w-full space-y-8">
<!-- Color Selector -->
<div class="space-y-4">
<div class="flex justify-between items-baseline">
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase">Color</h3>
<span class="font-body-md text-body-md text-on-surface">Paper White</span>
</div>
<div class="flex space-x-4">
<button aria-label="Paper White color, selected" class="w-12 h-12 rounded-full border-2 border-primary bg-[#fcfaf7] shadow-sm flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-xl">check</span>
</button>
<button aria-label="Sumi Black color" class="w-12 h-12 rounded-full border border-outline-variant bg-[#1a1a1b] hover:border-primary transition-colors"></button>
<button aria-label="Indigo color" class="w-12 h-12 rounded-full border border-outline-variant bg-[#1e2a4f] hover:border-primary transition-colors"></button>
</div>
</div>
<hr class="border-t border-outline-variant/50 w-1/3"/>
<!-- Size Selector -->
<div class="space-y-4">
<div class="flex justify-between items-baseline">
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase">Size</h3>
<a class="font-body-md text-body-md text-outline hover:text-primary underline decoration-1 underline-offset-4 text-sm" href="#">Size Guide</a>
</div>
<div class="grid grid-cols-4 gap-3">
<button class="py-3 border border-outline-variant bg-surface text-center font-body-md text-body-md hover:border-primary transition-colors">S</button>
<button class="py-3 border border-outline-variant bg-surface text-center font-body-md text-body-md hover:border-primary transition-colors">M</button>
<button class="py-3 border-2 border-primary bg-primary-fixed text-center font-body-md text-body-md font-medium text-primary">L</button>
<button class="py-3 border border-outline-variant bg-surface text-center font-body-md text-body-md hover:border-primary transition-colors">XL</button>
</div>
</div>
</section>
</main>
<!-- Pinned Action Bottom -->
<div class="fixed bottom-0 w-full bg-surface/95 backdrop-blur-md border-t border-outline-variant p-margin-mobile z-50">
<div class="flex justify-between items-end mb-4">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-1">Total</span>
<span class="font-headline-md text-headline-md leading-none">$284.50</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant text-sm">Inc. License</span>
</div>
<button class="w-full bg-[#c41e3a] hover:bg-[#a0182f] text-on-primary py-4 px-6 flex justify-between items-center transition-colors">
<span class="font-body-md text-body-md font-medium uppercase tracking-wider">Continue to Checkout</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</body></html>
