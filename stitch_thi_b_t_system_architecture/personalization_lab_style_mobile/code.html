<body class="antialiased min-h-screen flex flex-col relative pb-24 md:pb-0">

<header class="flex justify-between items-center w-full px-margin-mobile py-4 bg-transparent absolute top-0 z-10">

<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Step 2: Style</span>

<div class="flex items-center gap-3">
<div class="w-5 h-5 rounded-full border border-outline-variant relative radio-indicator transition-colors duration-200"></div>

</div>
</div>

<div class="w-full aspect-[2/1] bg-surface-container-highest rounded-md overflow-hidden relative border border-surface-dim">

</div>
</div>
</div>

                        Most Popular

<div class="flex items-center justify-between">
<div class="flex items-center gap-3">

</div>
</div>
</div>
